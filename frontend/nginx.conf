server {
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  location /api/ {
    proxy_pass http://api:8000/;
    proxy_set_header Host $host;
    add_header Cache-Control "no-store" always;
    client_max_body_size 1m;
  }
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location = /management { return 302 /management/; }
  location /management/ { try_files $uri $uri/ /management/index.html; }
  location / { try_files $uri $uri/ /index.html; }
}
